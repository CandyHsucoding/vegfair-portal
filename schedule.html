<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2026 書展 吉祥動物蔬食派對 營養師支援期間 11/7–11/10 校外教學時段排程">
<title>蔬食派對校外教學排程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  /* Layout: poster-style sky/grass hero (from the 2026 吉祥動物蔬食派對 key visual), then sticker cards on cream: figure strip + day × slot board; phones get a per-day timeline.
     Single light look on purpose, matching the printed materials. */
  :root {
    --sky: #8fd0f2;
    --grass: #7cc35a;
    --grass-deep: #4f9a3a;
    --cream: #fff8ec;
    --card: #ffffff;
    --ink: #3b2a20;        /* warm brown, as on the print pieces */
    --muted: #7a6656;
    --line: #e8dccb;
    --t-orange: #f05a28;   /* 吉祥動物 */
    --t-green: #2e9e44;    /* 蔬食 */
    --t-pink: #e6247a;     /* 派對 */
    --butter: #f6cd4c;     /* badge pill */
    --warn: #e07b00;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --r: 18px;
    --shadow: 4px 4px 0 var(--ink);
    color-scheme: light;
  }

  body { background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .inner { max-width: 82rem; margin: 0 auto; }

  /* Hero: sky over grass */
  .hero { background: linear-gradient(var(--sky) 0 62%, var(--grass) 62% 100%); padding-block: 26px 30px; }
  .hero .inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 28px; }
  .title { margin: 0; font-weight: 900; font-size: clamp(1.9rem, 4.6vw, 3.1rem); line-height: 1.15; letter-spacing: .02em;
    paint-order: stroke fill; -webkit-text-stroke: 7px #fff; text-wrap: balance; }
  .title .o { color: var(--t-orange); } .title .g { color: var(--t-green); } .title .p { color: var(--t-pink); }
  .pill { display: inline-block; margin-top: 12px; padding: 5px 16px; border-radius: 10px; background: var(--butter); color: var(--ink); font-weight: 700; font-size: 15px; }
  .sub { margin: 10px 0 0; color: #fff; font-weight: 700; font-size: 13.5px; text-shadow: 0 1px 0 var(--grass-deep); }
  .hero-side { display: flex; flex-direction: column; align-items: flex-end; gap: 16px; }
  .crew { display: flex; gap: 10px; }
  .crew img { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff; background: #fff; box-shadow: 3px 3px 0 var(--ink); object-fit: cover; }
  .range { background: var(--card); border-radius: var(--r); box-shadow: 5px 5px 0 var(--ink); padding: 12px 20px; display: flex; flex-direction: column; gap: 2px; }
  .range span { font-size: 13px; color: var(--muted); font-weight: 700; }
  .range b { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--t-green); }

  .wrap { padding-block: 22px 40px; }
  .wrap .inner { display: flex; flex-direction: column; gap: 20px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { background: var(--card); border: 2.5px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kpi > span { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 700; }
  .kpi > span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--dot); flex: none; }
  .kpi:nth-child(1) { --dot: var(--t-orange); } .kpi:nth-child(2) { --dot: var(--t-green); }
  .kpi:nth-child(3) { --dot: var(--t-pink); } .kpi:nth-child(4) { --dot: var(--butter); }
  .kpi strong { font-weight: 900; font-size: 2.1rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .kpi strong small { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 4px; }
  .kpi em { font-style: normal; color: var(--muted); font-size: 12.5px; }

  .board { background: var(--card); border: 2.5px solid var(--ink); border-radius: var(--r); box-shadow: 5px 5px 0 var(--ink); padding: 16px 20px 18px; min-width: 0; }
  .board-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
  h2 { margin: 0; display: inline-block; padding: 3px 14px; border-radius: 10px; background: var(--grass); color: #fff; font-size: 17px; font-weight: 900; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
  .sw-on { background: color-mix(in srgb, var(--grass) 55%, #fff); }
  .sw-off { border: 1.5px dashed var(--muted); }
  .sw-warn { background: #fff; box-shadow: inset 0 0 0 2.5px var(--warn); }

  /* Desktop grid */
  .grid { display: grid; grid-template-columns: 7.5rem repeat(8, minmax(0, 1fr)); gap: 7px; }
  .colh { color: var(--muted); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 4px 2px; white-space: nowrap; }
  .rowh { padding: 10px 4px; }
  .rowh b { display: block; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .rowh span { display: block; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .rowh.quiet b { color: var(--muted); font-weight: 700; font-size: 16px; }
  .cell { border-radius: 12px; padding: 10px 11px; min-height: 6.2rem; display: flex; flex-direction: column; min-width: 0; border: 1.5px solid color-mix(in srgb, var(--grass-deep) 35%, transparent); }
  .cell .n { font-weight: 900; font-size: 1.65rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .cell .n small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .cell .s { font-weight: 700; font-size: 13.5px; line-height: 1.3; margin-top: 8px; overflow-wrap: anywhere; }
  .cell .g { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
  .cell.empty { border: 1.5px dashed var(--line); background: var(--cream); color: var(--muted); align-items: center; justify-content: center; font-size: 13px; }
  .cell.warn { border: 2.5px solid var(--warn); }
  .flag { display: inline-block; margin-top: auto; padding-top: 6px; color: var(--warn); font-size: 12px; font-weight: 900; }
  .rest { grid-column: 2 / -1; border: 1.5px dashed var(--line); background: var(--cream); border-radius: 12px; color: var(--muted); font-size: 13px; display: flex; align-items: center; padding: 8px 14px; }

  /* Phone timeline */
  .days { display: none; flex-direction: column; gap: 18px; }
  .day h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 17px; font-weight: 900; }
  .day h3 span { color: var(--muted); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .day ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .slot { display: grid; grid-template-columns: 3.4rem 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; border: 1.5px solid color-mix(in srgb, var(--grass-deep) 35%, transparent); }
  .slot time { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; color: var(--muted); }
  .slot .who b { display: block; font-size: 14px; line-height: 1.3; }
  .slot .who span { color: var(--muted); font-size: 12.5px; }
  .slot .who .w { color: var(--warn); font-weight: 900; }
  .slot .pp { font-weight: 900; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .slot .pp small { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 2px; }
  .slot.empty { border: 1.5px dashed var(--line); background: var(--cream); padding-block: 6px; color: var(--muted); font-size: 13px; }
  .slot.warn { border: 2.5px solid var(--warn); }
  .day.quiet { color: var(--muted); font-size: 14px; margin: 0; }

  .notes { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .note { margin: 0; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; background: color-mix(in srgb, var(--butter) 30%, #fff); border: 2px solid var(--butter); }
  .note b { color: var(--warn); font-weight: 900; }

  footer { color: var(--muted); font-size: 12.5px; }
  footer p { margin: 0; }

  @media (max-width: 760px) {
    .grid-wrap { display: none; }
    .days { display: flex; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { background: linear-gradient(var(--sky) 0 58%, var(--grass) 58% 100%); }
    .hero-side { align-items: flex-start; width: 100%; }
    .crew { gap: 8px; }
    .crew img { width: 52px; height: 52px; border-width: 2.5px; }
    .board { padding: 14px 14px 16px; }
  }
</style>
<style>html,body{margin:0}*,*::before,*::after{box-sizing:border-box}</style>

<div class="wrap gutter">
  <div class="inner">
    <section class="kpis" aria-label="重點數字">
      <div class="kpi"><span>來訪總人數</span><strong id="k-people"></strong><em id="k-avg"></em></div>
      <div class="kpi"><span>預約團數</span><strong id="k-groups"></strong><em>每團 20 分鐘</em></div>
      <div class="kpi"><span>最忙的一天</span><strong id="k-peak"></strong><em id="k-peak-sub"></em></div>
      <div class="kpi"><span>還可排團的時段</span><strong id="k-free"></strong><em>有預約的日子，每天 8 個時段</em></div>
    </section>

    <section class="board" aria-labelledby="board-title">
      <div class="board-head">
        <h2 id="board-title">時段排程</h2>
        <div class="legend">
          <span><i class="sw-on"></i>已預約（綠色越深人越多）</span>
          <span><i class="sw-off"></i>空檔</span>
          <span><i class="sw-warn"></i>待確認</span>
        </div>
      </div>
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
      <div class="days" id="days"></div>
      <div class="notes" id="notes"></div>
    </section>

    <footer>
      <p>資料來源：45_高雄市教育局預約表（11/05 更新版），2026/11/09 整理。人數含義工。<a href="./" style="color:inherit">回入口頁</a></p>
    </footer>
  </div>
</div>

<script>
  // 營養師支援期間
  const RANGE = ['2026-11-07', '2026-11-10'];
  const SLOTS = ['09:30-09:50', '10:00-10:20', '10:30-10:50', '11:00-11:20', '11:30-11:50', '12:00-12:20', '12:30-12:50', '13:00-13:20'];
  // 原表中 11/7–11/10 的預約
  const BOOKINGS = [
    { date: '2026-11-09', slot: '10:00-10:20', school: '文德國小-3（分組）', grade: '407、408 班', people: 30 },
    { date: '2026-11-09', slot: '10:30-10:50', school: '文德國小-1（分組）', grade: '403、404 班', people: 51 },
    { date: '2026-11-09', slot: '11:30-11:50', school: '新進國小-1', grade: '六年級', people: 42 },
    { date: '2026-11-09', slot: '12:30-12:50', school: '漢民國小-4', grade: '五年級', people: 30 },
    { date: '2026-11-10', slot: '10:00-10:20', school: '後壁區永安國小-1', grade: '一至六年級', people: 42 },
    { date: '2026-11-10', slot: '10:30-10:50', school: '七股國小-1', grade: '一、二年級', people: 38 },
    { date: '2026-11-10', slot: '11:00-11:20', school: '田子國小-1', grade: '三、六年級', people: 37 },
    { date: '2026-11-10', slot: '11:30-11:50', school: '鹽埔國小-1', grade: '四年級', people: 33 },
    { date: '2026-11-10', slot: '12:00-12:20', school: '鳳山區忠孝國小-1（分組）', grade: '二年 1 班', people: 28 },
    { date: '2026-11-10', slot: '12:30-12:50', school: '前鎮區仁愛國小-2', grade: '五、六年級', people: 41 },
  ];

  const WEEK = '日一二三四五六';
  const dayLabel = (d) => { const t = new Date(d + 'T00:00:00Z'); return `${t.getUTCMonth() + 1}/${t.getUTCDate()}（${WEEK[t.getUTCDay()]}）`; };
  const slotLabel = (s) => s.replace('-', '–');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const withUnit = (tag, cls, n, unit) => { const e = el(tag, cls, String(n)); e.appendChild(el('small', null, unit)); return e; };

  const days = [];
  for (let t = Date.parse(RANGE[0] + 'T00:00:00Z'); t <= Date.parse(RANGE[1] + 'T00:00:00Z'); t += 864e5) {
    const date = new Date(t).toISOString().slice(0, 10);
    const rows = BOOKINGS.filter((b) => b.date === date);
    days.push({ date, rows, people: rows.reduce((s, b) => s + b.people, 0) });
  }
  const active = days.filter((d) => d.rows.length);
  const quiet = days.filter((d) => !d.rows.length);
  const total = BOOKINGS.reduce((s, b) => s + b.people, 0);
  const peak = active.slice().sort((a, b) => b.people - a.people)[0];
  const free = active.length * SLOTS.length - new Set(BOOKINGS.map((b) => b.date + b.slot)).size;
  const maxP = Math.max(...BOOKINGS.map((b) => b.people));
  const tint = (p) => `color-mix(in srgb, var(--grass) ${Math.round(18 + 34 * p / maxP)}%, #fff)`;

  document.getElementById('range').textContent = `${dayLabel(RANGE[0])} ～ ${dayLabel(RANGE[1])}`;
  document.getElementById('k-people').replaceChildren(withUnit('span', null, total, '人'));
  document.getElementById('k-avg').textContent = `含義工，每團平均 ${Math.round(total / BOOKINGS.length)} 人`;
  document.getElementById('k-groups').replaceChildren(withUnit('span', null, BOOKINGS.length, '團'));
  document.getElementById('k-peak').textContent = peak ? dayLabel(peak.date) : '—';
  document.getElementById('k-peak-sub').textContent = peak ? `${peak.rows.length} 團 · ${peak.people} 人` : '';
  document.getElementById('k-free').replaceChildren(withUnit('span', null, free, '個'));

  // Desktop grid
  const grid = document.getElementById('grid');
  grid.appendChild(el('div', 'colh', ''));
  for (const s of SLOTS) grid.appendChild(el('div', 'colh', slotLabel(s)));
  for (const d of days) {
    const h = el('div', 'rowh' + (d.rows.length ? '' : ' quiet'));
    h.append(el('b', null, dayLabel(d.date)), el('span', null, d.rows.length ? `${d.rows.length} 團 · ${d.people} 人` : '無預約'));
    grid.appendChild(h);
    if (!d.rows.length) { grid.appendChild(el('div', 'rest', '這天沒有校外教學預約')); continue; }
    for (const s of SLOTS) {
      const b = d.rows.find((r) => r.slot === s);
      if (!b) { grid.appendChild(el('div', 'cell empty', '空檔')); continue; }
      const c = el('div', 'cell' + (b.note ? ' warn' : ''));
      c.style.background = tint(b.people);
      c.title = `${dayLabel(b.date)} ${slotLabel(b.slot)}｜${b.school}｜${b.grade}｜${b.people} 人`;
      c.append(withUnit('span', 'n', b.people, '人'), el('span', 's', b.school), el('span', 'g', b.grade));
      if (b.note) c.appendChild(el('span', 'flag', '⚠ 待確認'));
      grid.appendChild(c);
    }
  }

  // Phone timeline
  const list = document.getElementById('days');
  for (const d of days) {
    if (!d.rows.length) continue;
    const sec = el('section', 'day');
    const h = el('h3', null, dayLabel(d.date)); h.appendChild(el('span', null, `${d.rows.length} 團 · ${d.people} 人`));
    const ol = el('ol');
    for (const s of SLOTS) {
      const b = d.rows.find((r) => r.slot === s);
      const li = el('li', 'slot' + (b ? '' : ' empty') + (b && b.note ? ' warn' : ''));
      li.appendChild(el('time', null, s.slice(0, 5)));
      if (!b) { li.appendChild(el('span', null, '空檔')); ol.appendChild(li); continue; }
      li.style.background = tint(b.people);
      const who = el('div', 'who'); who.append(el('b', null, b.school), el('span', null, b.grade));
      if (b.note) who.appendChild(el('span', 'w', '　⚠ 待確認'));
      li.append(who, withUnit('span', 'pp', b.people, '人'));
      ol.appendChild(li);
    }
    sec.append(h, ol);
    list.appendChild(sec);
  }
  if (quiet.length) list.appendChild(el('p', 'day quiet', `${quiet.map((d) => dayLabel(d.date)).join('、')} 沒有校外教學預約。`));

  // Notes
  const notes = document.getElementById('notes');
  for (const b of BOOKINGS.filter((x) => x.note)) {
    const p = el('p', 'note');
    p.append(el('b', null, '⚠ 待確認　'), document.createTextNode(`${dayLabel(b.date)} ${b.slot.slice(0, 5)} ${b.school}：${b.note}`));
    notes.appendChild(p);
  }
</script>
